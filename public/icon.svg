<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#140608"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#ef4444" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Cyber Grid Circuit Hints -->
  <g opacity="0.25" stroke="#06b6d4" stroke-width="2">
    <line x1="64" y1="128" x2="180" y2="128"/>
    <circle cx="180" cy="128" r="4" fill="#06b6d4"/>
    <line x1="448" y1="128" x2="332" y2="128"/>
    <circle cx="332" cy="128" r="4" fill="#06b6d4"/>
    <line x1="64" y1="384" x2="200" y2="384"/>
    <circle cx="200" cy="384" r="4" fill="#06b6d4"/>
    <line x1="448" y1="384" x2="312" y2="384"/>
    <circle cx="312" cy="384" r="4" fill="#06b6d4"/>
  </g>

  <!-- Outer Shield Glow -->
  <path d="M 256 70 L 390 125 C 390 280 256 390 256 430 C 256 390 122 280 122 125 Z" 
        fill="none" stroke="#ef4444" stroke-width="6" opacity="0.6" filter="url(#glow)"/>

  <!-- Main Shield -->
  <path d="M 256 80 L 380 130 C 380 270 256 375 256 415 C 256 375 132 270 132 130 Z" 
        fill="url(#shieldGrad)" stroke="#fca5a5" stroke-width="3"/>

  <!-- Inner Firewall Core -->
  <path d="M 256 120 L 340 160 C 340 250 256 325 256 355 C 256 325 172 250 172 160 Z" 
        fill="#0b0e14" stroke="#06b6d4" stroke-width="3"/>

  <!-- Firewall Flame / Energy Symbol -->
  <path d="M 256 160 C 275 200 310 220 300 260 C 290 295 256 315 256 315 C 256 315 222 295 212 260 C 202 220 237 200 256 160 Z" 
        fill="#f97316"/>
  <path d="M 256 200 C 267 225 285 240 280 265 C 273 285 256 295 256 295 C 256 295 239 285 232 265 C 227 240 245 225 256 200 Z" 
        fill="#fbbf24"/>

  <!-- Central Lock Shackle -->
  <path d="M 244 240 L 244 228 C 244 221 249 216 256 216 C 263 216 268 221 268 228 L 268 240" 
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="238" y="240" width="36" height="26" rx="5" fill="#ffffff"/>
  <circle cx="256" cy="251" r="3.5" fill="#dc2626"/>
  <line x1="256" y1="253" x2="256" y2="260" stroke="#dc2626" stroke-width="2"/>
</svg>
